    <form name="corporate-contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>

      <input name="bot-field" type="text" />
      <input name="source" type="text" />

      <input name="company" type="text" />
      <input name="service" type="text" />
      <textarea name="message"></textarea>
      <input name="consent" type="checkbox" value="accepted" />
    </form>
    <form name="career-application" method="POST" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="career-application" />
      <input name="bot-field" type="text" />
      <input name="name" type="text" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <input name="position" type="text" />
      <input name="experience" type="text" />
      <textarea name="message"></textarea>
      <input name="cv" type="file" />
      <input name="consent" type="checkbox" value="accepted" />
