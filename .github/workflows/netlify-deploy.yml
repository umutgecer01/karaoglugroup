name: Publish approved Karaoglu production release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH_KARAOGLUGROUPNET to approve this publication'
        required: true
        type: string
      expected_sha:
        description: 'Exact lowercase 40-character SHA of main to publish'
        required: true
        type: string
      reviewed_preview_sha:
        description: 'Exact PR head SHA with a successful same-project preview and the same tree as main'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: karaoglugroupnet-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify approved main and publish a locked release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      statuses: read
      actions: read
      security-events: read
      deployments: read
    environment:
      name: production
      url: https://karaoglugroupnet.netlify.app/
    env:
      VITE_SITE_URL: https://karaoglugroupnet.netlify.app/
      VITE_NETLIFY_FORMS_ENABLED: 'false'
      CONTEXT: production
      NETLIFY_SITE_ID: b4753086-eb94-4a7e-b5f5-7270835fab3a
      PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      REVIEWED_PREVIEW_SHA: ${{ inputs.reviewed_preview_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact commit, review protection and remote gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/production-preflight.mjs

      - name: Security check
        run: npm run security:check

      - name: Regression tests
        run: npm test

      - name: Production guard tests
        run: node --test scripts/production-policy.test.mjs

      - name: Build
        run: npm run build

      - name: Check generated production HTML and closed forms
        run: node --test scripts/release-static.test.mjs

      - name: Install pinned official Netlify CLI without publication credentials
        run: npm install --prefix "$RUNNER_TEMP/karaoglu-netlify-cli" --no-audit --no-fund --package-lock=false --save-exact netlify-cli@27.16.2

      - name: Upload, verify and publish the exact artifact while preserving the lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_CLI_PATH: ${{ runner.temp }}/karaoglu-netlify-cli/node_modules/netlify-cli/bin/run.js
        run: node scripts/production-publish.mjs

      - name: Preserve publication checkpoint and hash manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-publication-${{ github.run_id }}
          path: |
            .audit/production-publish/*/publication.json
            .audit/production-publish/*/manifest.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
