name: CI

on:
  push:
    branches: [main, 'feature/**', 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security check
        run: npm run security:check

      - name: Build
        run: npm run build

      - name: Regression tests
        run: npm test

      - name: Release HTML and metadata checks
        run: node --test scripts/release-static.test.mjs

      - name: Validate proposed domain locally without deployment
        env:
          VITE_SITE_URL: 'https://karaoglugroupglobal.com/'
          VITE_NETLIFY_FORMS_ENABLED: 'false'
          VITE_CONTACT_FORMS_ENABLED: 'false'
          VITE_CAREER_FORMS_ENABLED: 'false'
          CONTEXT: 'production'
        run: |
          npm run build
          node --test scripts/release-static.test.mjs
